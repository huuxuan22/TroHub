# TroHub — Docker Compose v2 (local dev, MySQL trên Windows host)
# Yêu cầu: Docker Desktop + MySQL local; DATABASE_URL dùng host.docker.internal
#
# Chuẩn bị:
#   cp backend/.env.example backend/.env
#   cp chats/.env.example chats/.env
#   cp crawl/.env.example crawl/.env
#   cp frontend/.env.example frontend/.env   (optional — Vite)
#
# Chạy: docker compose up --build
# MinIO (tuỳ chọn): docker compose up -d minio — docs/MINIO_SUPPLEMENT.md

name: trohub

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trohub_frontend
    # Volume node_modules có thể cũ hơn package.json — cài deps mỗi lần khởi động.
    command:
      - sh
      - -c
      - npm install --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - trohub_frontend_node_modules:/app/node_modules
    env_file:
      - path: ./frontend/.env
        required: false
    environment:
      # Phải khớp import.meta.env.VITE_API_BASE_URL trong FE (trình duyệt gọi host qua cổng publish)
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
      VITE_CHATS_HTTP: ${VITE_CHATS_HTTP:-http://localhost:8001}
      VITE_CHATS_WS: ${VITE_CHATS_WS:-ws://localhost:8001}
      VITE_CRAWLER_BASE: ${VITE_CRAWLER_BASE:-http://localhost:8002}
    restart: unless-stopped
    depends_on:
      - backend
      - chats
      - crawler

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trohub_backend
    # Cài lại deps từ requirements.txt mỗi lần khởi động (volume mount + image cache cũ hay gây thiếu sqlalchemy)
    command:
      - sh
      - -c
      - pip install --no-cache-dir -r requirements.txt && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: ${BACKEND_DATABASE_URL:-mysql+pymysql://root:yourpassword@host.docker.internal:3306/trohub?charset=utf8mb4}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  chats:
    build:
      context: ./chats
      dockerfile: Dockerfile
    container_name: trohub_chats
    ports:
      - "8001:8001"
    volumes:
      - ./chats:/app
    env_file:
      - path: ./chats/.env
        required: false
    environment:
      DATABASE_URL: ${CHATS_DATABASE_URL:-mysql+pymysql://root:yourpassword@host.docker.internal:3306/trohub?charset=utf8mb4}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  crawler:
    build:
      context: ./crawl
      dockerfile: Dockerfile
    container_name: trohub_crawler
    ports:
      - "8002:8002"
    volumes:
      - ./crawl:/app
    env_file:
      - path: ./crawl/.env
        required: false
    environment:
      DATABASE_URL: ${CRAWLER_DATABASE_URL:-mysql+pymysql://root:yourpassword@host.docker.internal:3306/trohub?charset=utf8mb4}
      # Trong Docker, 127.0.0.1 là chính container crawl — phải gọi service backend trên mạng compose.
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://backend:8000}
      BACKEND_NORMALIZE_URL: ${BACKEND_NORMALIZE_URL:-http://backend:8000/trohub/internal/crawl/trigger-normalize}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: trohub_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - trohub_minio_data:/data
    restart: unless-stopped

volumes:
  trohub_frontend_node_modules:
  trohub_minio_data:
